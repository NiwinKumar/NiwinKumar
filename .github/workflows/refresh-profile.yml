name: Refresh profile images

on:
  schedule:
    - cron: "17 21 * * *" # daily, 02:47 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/**"]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Render images
        run: node scripts/render.mjs
        env:
          GH_USER: ${{ github.repository_owner }}
          # Add a STATS_TOKEN secret (classic PAT, read:user) to include private contributions.
          GH_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --staged --quiet || (git commit -m "Refresh profile images" && git push)
