<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" fill="none">
<style>
  .sans{font-family:Inter,-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif}
  .serif{font-family:'Instrument Serif','New York','Iowan Old Style',Georgia,'Times New Roman',serif}
  .mono{font-family:'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace}
  .rise{opacity:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;opacity:1!important}}
  .ping{transform-origin:68px 384px;animation:ping 2.4s cubic-bezier(0,0,.2,1) infinite}
  @keyframes ping{0%{transform:scale(1);opacity:.9}80%,100%{transform:scale(3.4);opacity:0}}</style>
<defs><clipPath id="hd-c"><rect width="1200" height="440" rx="26"/></clipPath></defs>
<g clip-path="url(#hd-c)"><rect width="1200" height="440" fill="#0F0F11"/>
<defs>
  <pattern id="hd-g" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" stroke="#1F1F23" stroke-width="1"/>
  </pattern>
  <radialGradient id="hd-fade" cx="0.5" cy="0.35" r="0.75">
    <stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <mask id="hd-m"><rect width="1200" height="440" fill="url(#hd-fade)"/></mask>
</defs>
<rect width="1200" height="440" fill="url(#hd-g)" mask="url(#hd-m)" opacity="0.55"/>
<defs><radialGradient id="hd-glow" cx="0.82" cy="0.05" r="0.6">
  <stop offset="0" stop-color="#8FCFB0" stop-opacity="0.16"/><stop offset="1" stop-color="#8FCFB0" stop-opacity="0"/>
</radialGradient></defs>
<rect width="1200" height="440" fill="url(#hd-glow)"/>

<text x="56" y="70" class="mono rise" font-size="15" letter-spacing="2.4" fill="#8B8B94">NIWIN KUMAR  /  SOFTWARE ENGINEER</text>
<text x="1144" y="70" text-anchor="end" class="mono rise" font-size="15" letter-spacing="2.4" fill="#4B4B53">CHENNAI  ·  13.08°N  80.27°E</text>
<line x1="56" y1="96" x2="1144" y2="96" stroke="#1F1F23"/>

<text x="52" y="236" class="rise" style="animation-delay:.12s" fill="#EDEDEF">
  <tspan class="sans" font-size="112" font-weight="600" letter-spacing="-5">Niwin</tspan><tspan class="serif" font-size="120" font-style="italic" font-weight="400" letter-spacing="-2" fill="#8FCFB0" dx="26">Kumar</tspan>
</text>
<text x="58" y="292" class="sans rise" style="animation-delay:.25s" font-size="27" fill="#8B8B94" letter-spacing="-.3">Applied-AI products and agent tooling, built end to end.</text>

<line x1="56" y1="344" x2="1144" y2="344" stroke="#1F1F23"/>
<g class="rise" style="animation-delay:.4s">
  <circle cx="68" cy="384" r="5" fill="#8FCFB0"/>
  <circle cx="68" cy="384" r="5" fill="none" stroke="#8FCFB0" class="ping"/>
  <text x="86" y="390" class="sans" font-size="18" font-weight="600" fill="#EDEDEF">Open to roles</text>
  <text x="214" y="390" class="mono" font-size="15" letter-spacing=".6" fill="#8B8B94">Full-stack · Product · Applied AI · Forward-deployed</text>
  <text x="1144" y="390" text-anchor="end" class="mono" font-size="15" letter-spacing=".6" fill="#4B4B53">India · London · Europe · Remote</text>
</g>
</g><rect x=".5" y=".5" width="1199" height="439" rx="25.5" stroke="#1F1F23"/>
</svg>