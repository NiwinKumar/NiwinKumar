<text x="38" y="136" class="sans" font-size="40" font-weight="600" letter-spacing="-1.4" fill="#EDEDEF">Willow</text>
<text x="40" y="168" class="mono" font-size="13.5" letter-spacing=".4" fill="#4B4B53">Google Cloud AI Builder Cup 2026</text>
<circle cx="428" cy="112" r="11" fill="#8FCFB0" fill-opacity="0.18" stroke="#8FCFB0" stroke-opacity="0.28"/><text x="428" y="146" text-anchor="middle" class="mono" font-size="11" fill="#4B4B53">W1</text><circle cx="454" cy="112" r="11" fill="#8FCFB0" fill-opacity="0.34" stroke="#8FCFB0" stroke-opacity="0.44"/><text x="454" y="146" text-anchor="middle" class="mono" font-size="11" fill="#4B4B53">W2</text><circle cx="480" cy="112" r="11" fill="#8FCFB0" fill-opacity="0.50" stroke="#8FCFB0" stroke-opacity="0.60"/><text x="480" y="146" text-anchor="middle" class="mono" font-size="11" fill="#4B4B53">W3</text><circle cx="506" cy="112" r="11" fill="#8FCFB0" fill-opacity="0.66" stroke="#8FCFB0" stroke-opacity="0.76"/><text x="506" y="146" text-anchor="middle" class="mono" font-size="11" fill="#4B4B53">W4</text><circle cx="532" cy="112" r="11" fill="#8FCFB0" fill-opacity="0.82" stroke="#8FCFB0" stroke-opacity="0.92"/><text x="532" y="146" text-anchor="middle" class="mono" font-size="11" fill="#4B4B53">W5</text><circle cx="558" cy="112" r="11" fill="#8FCFB0" fill-opacity="0.98" stroke="#8FCFB0" stroke-opacity="1.08"/><text x="558" y="146" text-anchor="middle" class="mono" font-size="11" fill="#4B4B53">W6</text><circle cx="558" cy="112" r="11" fill="none" stroke="#C6EBD8" class="ring"/>
<text x="40" y="214" class="sans" font-size="18" fill="#8B8B94">Weekly clip-on dermatology-lens photos that</text>
<text x="40" y="240" class="sans" font-size="18" fill="#8B8B94">show whether a skincare routine is working.</text>
<text x="40" y="266" class="sans" font-size="18" fill="#8B8B94">Built for every skin tone.</text>
<rect x="40" y="290" width="122" height="32" rx="16" stroke="#2A2A30"/>
<text x="101" y="311" text-anchor="middle" class="mono" font-size="13.5" fill="#8B8B94">TypeScript</text><rect x="172" y="290" width="168" height="32" rx="16" stroke="#2A2A30"/>
<text x="256" y="311" text-anchor="middle" class="mono" font-size="13.5" fill="#8B8B94">Computer vision</text><rect x="350" y="290" width="85.19999999999999" height="32" rx="16" stroke="#2A2A30"/>
<text x="392.6" y="311" text-anchor="middle" class="mono" font-size="13.5" fill="#8B8B94">Gen AI</text>
</g><rect x=".5" y=".5" width="599" height="359" rx="21.5" stroke="#1F1F23"/>
</svg>