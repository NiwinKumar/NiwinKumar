<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" fill="none">
<style>
  .sans{font-family:Inter,-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif}
  .serif{font-family:'Instrument Serif','New York','Iowan Old Style',Georgia,'Times New Roman',serif}
  .mono{font-family:'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace}
  .rise{opacity:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;opacity:1!important}}
  .flow{animation:flow 1.6s linear infinite}@keyframes flow{to{stroke-dashoffset:-28}}
  .ring{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-in-out infinite}
  @keyframes ring{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.45);opacity:0}}</style>
<defs><clipPath id="willow-c"><rect width="600" height="360" rx="22"/></clipPath></defs>
<g clip-path="url(#willow-c)"><rect width="600" height="360" fill="#0F0F11"/>
<defs>
  <pattern id="willow-g" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M30 0H0V30" stroke="#1F1F23" stroke-width="1"/>
  </pattern>
  <radialGradient id="willow-fade" cx="0.5" cy="0.35" r="0.75">
    <stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <mask id="willow-m"><rect width="600" height="360" fill="url(#willow-fade)"/></mask>
</defs>
<rect width="600" height="360" fill="url(#willow-g)" mask="url(#willow-m)" opacity="0.55"/>
<text x="40" y="58" class="mono" font-size="14" letter-spacing="2" fill="#8FCFB0">01</text>
<text x="76" y="58" class="mono" font-size="14" letter-spacing="2" fill="#8B8B94">NOW BUILDING</text>
