<g clip-path="url(#ex-c)"><rect width="1000" height="336" fill="#0A0A0A"/><line x1="220.5" y1="40" x2="220.5" y2="296" stroke="#1F1F1F"/><text x="40" y="56" class="mono" font-size="13" fill="#5E5E5E">Jul 2025 – now</text><circle cx="220.5" cy="51.5" r="5" fill="#EDEDED" stroke="#EDEDED" stroke-opacity="1" stroke-width="1.5"/><text x="252" y="56" class="w600" font-size="17" fill="#EDEDED" letter-spacing="-0.17">Full-stack engineer, product and platform</text><text x="594.7" y="56" class="w500" font-size="17" fill="#5E5E5E">HappyFox</text><text x="252" y="84" class="w400" font-size="15.5" fill="#A1A1A1">Pitched and shipped two new products, plus MCP servers, integrations and migrations.</text><text x="40" y="160" class="mono" font-size="13" fill="#5E5E5E">Feb – Jul 2025</text><circle cx="220.5" cy="155.5" r="4" fill="#0A0A0A" stroke="#EDEDED" stroke-opacity="0.4" stroke-width="1.5"/><text x="252" y="160" class="w600" font-size="17" fill="#EDEDED" letter-spacing="-0.17">Backend engineer intern</text><text x="458.9" y="160" class="w500" font-size="17" fill="#5E5E5E">HappyFox</text><text x="252" y="188" class="w400" font-size="15.5" fill="#A1A1A1">LLM-assisted internal tools, third-party integrations and hiring-tool features.</text><text x="40" y="264" class="mono" font-size="13" fill="#5E5E5E">2020 – 2025</text><circle cx="220.5" cy="259.5" r="4" fill="#0A0A0A" stroke="#EDEDED" stroke-opacity="0.4" stroke-width="1.5"/><text x="252" y="264" class="w600" font-size="17" fill="#EDEDED" letter-spacing="-0.17">B.Tech and M.Tech, Computer Science</text><text x="573.9" y="264" class="w500" font-size="17" fill="#5E5E5E">VIT Chennai</text><text x="252" y="292" class="w400" font-size="15.5" fill="#A1A1A1">Business analytics and AI/ML, CGPA 8.4. Gymnastics gold medalist.</text><line x1="28" y1=".5" x2="972" y2=".5" stroke="url(#ex-e)"/></g>
