<svg xmlns="http://www.w3.org/2000/svg" width="490" height="430" viewBox="0 0 490 430" fill="none">
<style>
@font-face{font-family:I400;src:url(data:font/woff2;base64,) format('woff2')}
.w400{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text',I400,'Segoe UI',sans-serif;font-weight:400}
@font-face{font-family:I600;src:url(data:font/woff2;base64,) format('woff2')}
.w600{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text',I600,'Segoe UI',sans-serif;font-weight:600}
.mono{font-family:'SF Mono',ui-monospace,Menlo,Consolas,monospace}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs><filter id="sc-gl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter></defs>
<defs>
