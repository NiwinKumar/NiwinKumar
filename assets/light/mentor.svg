<mask id="mentor-m"><rect width="490" height="430" fill="url(#mentor-rf)"/></mask></defs>
<rect width="490" height="430" fill="url(#mentor-p)" mask="url(#mentor-m)" opacity=".35"/>
<circle cx="245" cy="128" r="84" stroke="#171717" stroke-opacity=".07" stroke-width="12"/>
<circle cx="245" cy="128" r="84" stroke="#171717" stroke-opacity="1" stroke-width="12" stroke-linecap="round" stroke-dasharray="527.8" stroke-dashoffset="95" transform="rotate(-90 245 128)"/><circle cx="245" cy="128" r="62" stroke="#171717" stroke-opacity=".07" stroke-width="12"/>
<circle cx="245" cy="128" r="62" stroke="#171717" stroke-opacity="0.6" stroke-width="12" stroke-linecap="round" stroke-dasharray="389.6" stroke-dashoffset="140.2" transform="rotate(-90 245 128)"/><circle cx="245" cy="128" r="40" stroke="#171717" stroke-opacity=".07" stroke-width="12"/>
