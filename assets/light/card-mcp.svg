  </pattern>
  <radialGradient id="mcp-fade" cx="0.5" cy="0.35" r="0.75">
    <stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <mask id="mcp-m"><rect width="600" height="360" fill="url(#mcp-fade)"/></mask>
</defs>
<rect width="600" height="360" fill="url(#mcp-g)" mask="url(#mcp-m)" opacity="0.7"/>
